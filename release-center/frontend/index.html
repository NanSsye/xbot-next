<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Xbot · 运营工作台</title><link rel="icon" href="/mascot.png"><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body>
<main id="login" hidden><section class="login-box"><img src="/mascot.png" width="74" height="74" alt=""><p class="brand">Xbot</p><h1>管理员登录</h1><form id="signin"><label>管理员账号<input name="user" required autocomplete="username"></label><label>密码<input name="password" required type="password" autocomplete="current-password"></label><button>登录运营工作台</button></form></section></main>
<div id="console" hidden><aside><div class="identity"><img src="/mascot.png" alt=""><div><strong>Xbot</strong><small>运营工作台</small></div></div><nav aria-label="主导航"></nav><button id="logout" class="secondary">退出登录</button></aside><main id="work"><div class="crumb">Xbot 管理中心 <span>/</span> <b id="position"></b></div><header><div><h1 id="title"></h1><p id="summary"></p></div><button id="action" hidden></button></header><section id="metrics"></section><section class="records"><div class="tools"><h2 id="listTitle"></h2><input id="search" type="search" aria-label="搜索记录" placeholder="搜索名称或版本"></div><div id="rows"></div></section></main></div>
<dialog id="drawer" aria-labelledby="drawerTitle"><form id="publish"><header><h2 id="drawerTitle">发布新版本</h2><button type="button" id="close" class="secondary" aria-label="关闭">关闭</button></header><label>资源标识<input name="name" required maxlength="80" pattern="[A-Za-z0-9][A-Za-z0-9._\-]{0,79}" placeholder="例如 xbot-next"></label><label>版本号<input name="version" required maxlength="80" placeholder="例如 1.2.0"></label><label>更新说明<textarea name="notes" rows="5" maxlength="500"></textarea></label><label>发行包（ZIP）<input name="file" required type="file" accept=".zip"></label><p id="publishError" role="alert"></p><button>确认发布</button></form></dialog><div role="status" id="message"></div></body></html>
