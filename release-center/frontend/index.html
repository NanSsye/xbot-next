<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Xbot 发布管理</title><link rel="stylesheet" href="/style.css"><header><strong>Xbot</strong> 发布管理<button id="logout" hidden>退出登录</button></header><main><section id="login"><h1>管理员登录</h1><form id="signin"><label>管理员账号<input name="user" required autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button>登录</button></form></section><section id="console" hidden><h1>发布中心</h1><form id="publish"><label>发布类型<select name="kind"><option value="framework">框架版本</option><option value="plugin">插件市场</option><option value="skill">技能库</option></select></label><label>包标识<input name="name" required pattern="[A-Za-z0-9][A-Za-z0-9._\-]{0,79}"></label><label>版本<input name="version" required></label><label>更新说明<textarea name="notes" maxlength="500"></textarea></label><label>发行包（ZIP）<input name="file" type="file" accept=".zip" required></label><button>发布到目录</button></form><h2>已发布</h2><ul id="items"></ul></section><p role="status" id="message"></p></main><script src="/app.js" defer></script></html>
