name: xbot-next-clean

services:
  xbot:
    image: ${XBOT_IMAGE:?Set XBOT_IMAGE to the release image tag}
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      XBOT_SERVER_HOST: 0.0.0.0
      XBOT_SERVER_PORT: "8548"
      XBOT_LOAD_DOTENV: "false"
      XBOT_API_AUTH_ENABLED: "true"
      XBOT_API_TOKEN: ${XBOT_API_TOKEN:?Set a new XBOT_API_TOKEN}
      XBOT_DATABASE_URL: "postgresql+asyncpg://xbot:${XBOT_POSTGRES_PASSWORD:?Set a URL-safe database password}@postgres:5432/xbot"
      XBOT_ADMIN_DATABASE_URL: ""
      XBOT_QUEUE_TYPE: redis
      XBOT_REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${XBOT_HOST_PORT:-18548}:8548"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./state/data:/app/data
      - ./state/logs:/app/logs
      - ./state/files:/app/files
      - ./state/workspace:/app/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xbot
      POSTGRES_DB: xbot
      POSTGRES_PASSWORD: ${XBOT_POSTGRES_PASSWORD:?Set a new database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "xbot", "-d", "xbot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
