name: xbot-next-clean

services:
  init-code:
    image: ${XBOT_IMAGE:?Set XBOT_IMAGE to the release image tag}
    pull_policy: never
    network_mode: none
    volumes:
      - ./release:/release
    entrypoint: ["/usr/local/bin/python", "-c"]
    command:
      - |
        import os, pathlib, shutil, tempfile
        target = pathlib.Path('/release/app')
        if target.is_symlink(): raise SystemExit('Unexpected app symlink')
        target.mkdir(exist_ok=True)
        marker = target / '.xbot-layout-v2'
        if marker.is_file():
            if not (target / '.venv/bin/xbot').is_file(): raise SystemExit('Existing app is incomplete; not overwriting')
        else:
            if any(p.name != 'database' for p in target.iterdir()): raise SystemExit('Existing installation: migrate persistent data before enabling layout v2')
            db = target / 'database'
            if db.is_symlink() or (db.exists() and any(p.is_symlink() or not p.is_dir() or p.name not in ('postgres', 'redis') or any(p.iterdir()) for p in db.iterdir())): raise SystemExit('Existing database: manual migration required')
            with tempfile.TemporaryDirectory(dir=target.parent) as stage:
                ready = pathlib.Path(stage) / 'app'
                shutil.copytree('/app', ready, symlinks=True)
                if not (ready / '.venv/bin/xbot').is_file() or (ready / 'database').exists(): raise SystemExit('Invalid runtime image')
                for child in ready.iterdir(): child.rename(target / child.name)
                marker.touch(exist_ok=False)
  xbot:
    container_name: xbot-pro
    image: ${XBOT_IMAGE:?Set XBOT_IMAGE to the release image tag}
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      XBOT_SERVER_HOST: 0.0.0.0
      XBOT_SERVER_PORT: "8548"
      XBOT_LOAD_DOTENV: "false"
      XBOT_API_AUTH_ENABLED: ${XBOT_API_AUTH_ENABLED:-false}
      XBOT_DATABASE_URL: "postgresql+asyncpg://xbot:${XBOT_POSTGRES_PASSWORD:?Set a URL-safe database password}@postgres:5432/xbot"
      XBOT_ADMIN_DATABASE_URL: ""
      XBOT_QUEUE_TYPE: redis
      XBOT_REDIS_URL: redis://redis:6379/0
    ports:
      - "${XBOT_LAN_IP:?Set the trusted LAN interface address}:${XBOT_HOST_PORT:-18548}:8548"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./release/app:/app
      - ./updater/requests:/run/xbot-updater/requests
      - ./updater/status:/run/xbot-updater/status:ro
    tmpfs:
      - /app/database:ro,noexec,nosuid,nodev,size=4k
    depends_on:
      init-code:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xbot
      POSTGRES_DB: xbot
      POSTGRES_PASSWORD: ${XBOT_POSTGRES_PASSWORD:?Set a new database password}
    volumes:
      - ./release/app/database/postgres:/var/lib/postgresql/data
    depends_on:
      init-code:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "xbot", "-d", "xbot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./release/app/database/redis:/data
    depends_on:
      init-code:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
